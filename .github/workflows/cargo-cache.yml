name: Warm cargo cache

# Populates the crate registry cache on main

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/Cargo.lock"
      - ".github/workflows/cargo-cache.yml"
  # Caches are evicted after 7 days unused; keep one alive between releases.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Fetch crates
        run: |
          cargo fetch --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
