name: Self-host

# Boots the self-host stack from images built out of this checkout and probes it.

# Keep the two path lists identical — Actions does not support YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "apps/server/**"
      - "packages/**"
      - "docker-compose.selfhost.yml"
      - "backup.sh"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/ci/**"
      - ".github/scripts/selfhost-*.sh"
      - ".github/workflows/selfhost.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - "apps/server/**"
      - "packages/**"
      - "docker-compose.selfhost.yml"
      - "backup.sh"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - ".github/ci/**"
      - ".github/scripts/selfhost-*.sh"
      - ".github/workflows/selfhost.yml"
  workflow_dispatch:

concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE_TAG: ci
  COMPOSE: docker compose -f docker-compose.selfhost.yml -f .github/ci/selfhost.override.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/doska-server:ci
          cache-from: type=gha,scope=selfhost-server
          cache-to: type=gha,mode=max,scope=selfhost-server

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/client/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/doska-web:ci
          cache-from: type=gha,scope=selfhost-web
          cache-to: type=gha,mode=max,scope=selfhost-web

      - name: Save images
        run: |
          docker save \
            ghcr.io/${{ github.repository_owner }}/doska-server:ci \
            ghcr.io/${{ github.repository_owner }}/doska-web:ci \
            | gzip -1 > /tmp/selfhost-images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-images
          path: /tmp/selfhost-images.tar.gz
          retention-days: 1
          compression-level: 0

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: selfhost-images, path: /tmp }
      - name: Load images
        run: docker load < /tmp/selfhost-images.tar.gz

      - name: Write .env
        run: ./.github/ci/write-env.sh http://127.0.0.1:8080

      - name: Required env vars are enforced
        run: |
          if err=$($COMPOSE --env-file /dev/null config --quiet 2>&1); then
            echo "compose accepted an empty env — AUTH_*/BASE_URL are no longer required" >&2
            exit 1
          fi
          case $err in
            *AUTH_* | *BASE_URL*) echo "ok: $err" ;;
            *) echo "compose failed for an unrelated reason: $err" >&2; exit 1 ;;
          esac

      - name: Start the stack
        run: $COMPOSE up -d --wait

      - name: Smoke test
        env:
          BASE: http://127.0.0.1:8080
          AUTH_LOGIN: smoke
          AUTH_PASSWORD: smoke-secret
        run: ./.github/scripts/selfhost-smoke.sh

      - name: BASE_URL overrides the inferred origin
        run: |
          sed -i 's|^BASE_URL=.*|BASE_URL=https://doska.ci.test|' .env
          $COMPOSE up -d --wait --force-recreate server
          BASE=http://127.0.0.1:8080 EXPECT_BASE_URL=https://doska.ci.test \
            ./.github/scripts/selfhost-smoke.sh discovery

      # The http:// scheme in DOMAIN turns Caddy's automatic HTTPS off, so this
      # covers the proxy chain without going to Let's Encrypt for a fake name.
      - name: https profile proxies to the stack
        run: |
          sed -i 's|^BASE_URL=.*|BASE_URL=http://doska.ci.test|' .env
          echo "DOMAIN=http://doska.ci.test" >> .env
          $COMPOSE --profile https up -d --wait
          BASE=http://127.0.0.1 HOST_HEADER=doska.ci.test \
            EXPECT_BASE_URL=http://doska.ci.test \
            ./.github/scripts/selfhost-smoke.sh api web discovery

      - name: Container logs
        if: failure()
        run: $COMPOSE --profile https logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE --profile https down --volumes --remove-orphans

  upgrade:
    needs: build
    runs-on: ubuntu-latest
    env:
      # No CI overlay: pull_policy stays `always` and the released images pull.
      # The file itself is the previous release's, written by the step below.
      COMPOSE_OLD: docker compose -f .selfhost-prev-compose.yml
    steps:
      - uses: actions/checkout@v4
        # Tags are how the previous release's compose file is recovered.
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: selfhost-images, path: /tmp }
      - name: Load images
        run: docker load < /tmp/selfhost-images.tar.gz

      - name: Write .env
        run: ./.github/ci/write-env.sh http://127.0.0.1:8080

      - name: Recover the previous release's compose file
        run: |
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            case "$tag" in *-*) continue ;; esac # skip prereleases
            PREV="$tag"; break
          done
          [ -n "${PREV:-}" ] || { echo "no release tag found"; exit 1; }
          echo "upgrading from $PREV"
          git show "$PREV:docker-compose.selfhost.yml" > .selfhost-prev-compose.yml

      - name: Start the last released version
        env:
          DOCKER_IMAGE_TAG: latest
        run: $COMPOSE_OLD up -d --wait

      - name: Seed data on the old version
        env:
          COMPOSE: docker compose -f .selfhost-prev-compose.yml
        run: ./.github/scripts/selfhost-data.sh seed

      - name: New images still run on the old compose file
        env:
          DOCKER_IMAGE_TAG: ci
          BASE: http://127.0.0.1:8080
          AUTH_LOGIN: smoke
          AUTH_PASSWORD: smoke-secret
        run: |
          docker compose -f .selfhost-prev-compose.yml \
            -f .github/ci/selfhost.override.yml up -d --wait
          ./.github/scripts/selfhost-smoke.sh

      - name: Upgrade to this checkout
        run: $COMPOSE up -d --wait

      - name: Data survived the upgrade
        run: ./.github/scripts/selfhost-data.sh verify

      - name: Smoke test after the upgrade
        env:
          BASE: http://127.0.0.1:8080
          AUTH_LOGIN: smoke
          AUTH_PASSWORD: smoke-secret
        run: ./.github/scripts/selfhost-smoke.sh

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: selfhost-images, path: /tmp }
      - name: Load images
        run: docker load < /tmp/selfhost-images.tar.gz

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @doska/e2e exec playwright install --with-deps chromium

      - name: Write .env
        run: ./.github/ci/write-env.sh http://127.0.0.1:8080

      - name: Start the stack
        run: $COMPOSE up -d --wait

      - name: E2E against the containers
        env:
          BASE_URL: http://127.0.0.1:8080
          AUTH_LOGIN: smoke
          AUTH_PASSWORD: smoke-secret
        run: pnpm e2e:container

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down --volumes --remove-orphans

  restore:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: selfhost-images, path: /tmp }
      - name: Load images
        run: docker load < /tmp/selfhost-images.tar.gz

      - name: Write .env
        run: ./.github/ci/write-env.sh http://127.0.0.1:8080

      - name: Start the stack and seed data
        run: |
          $COMPOSE up -d --wait
          ./.github/scripts/selfhost-data.sh seed

      - name: Back up
        run: |
          sh backup.sh
          ls -l backups/

      - name: Destroy the database
        run: $COMPOSE down --volumes

      # db only: a running server would migrate and seed the admin account
      # first, and the dump would land on tables and rows already there.
      - name: Restore into an empty database
        run: |
          $COMPOSE up -d --wait db
          dump=$(ls -t backups/*.sql.gz | head -1)
          gunzip -c "$dump" | \
            $COMPOSE exec -T db psql -U doska -d doska -v ON_ERROR_STOP=1 --quiet

      - name: Start the rest of the stack
        run: $COMPOSE up -d --wait

      - name: Data came back
        run: ./.github/scripts/selfhost-data.sh verify

      - name: Smoke test after the restore
        env:
          BASE: http://127.0.0.1:8080
          AUTH_LOGIN: smoke
          AUTH_PASSWORD: smoke-secret
        run: ./.github/scripts/selfhost-smoke.sh

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down --volumes --remove-orphans
