<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="strict-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Doska — a local-first Kanban board where every card is Markdown. Works offline and syncs through a server you host."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f7f7fa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#232939"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doska" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Doska" />
    <meta
      property="og:description"
      content="A local-first Kanban board where every card is Markdown. Works offline and syncs through a server you host."
    />
    <meta property="og:image" content="https://doska.sh/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Doska — a Kanban board made of Markdown"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Doska" />
    <meta
      name="twitter:description"
      content="A local-first Kanban board where every card is Markdown. Works offline and syncs through a server you host."
    />
    <meta name="twitter:image" content="https://doska.sh/og.png" />
    <title>Doska</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark
      // flash on reload. Mirrors ThemeProvider (storageKey "theme", default
      // "system"); the provider's effect re-affirms the same class on mount.
      ;(function () {
        try {
          var t = localStorage.getItem("theme")
          if (t !== "dark" && t !== "light" && t !== "system") t = "system"
          var resolved =
            t === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : t
          document.documentElement.classList.add(resolved)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
