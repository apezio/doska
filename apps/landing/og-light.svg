<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f7fa" />

  <!-- The header's mark, without favicon.svg's tile: on this ground the tile is
       invisible anyway, and dropping it lets the anchor set the lockup's left
       edge rather than sitting inset from it. The lockup has no text-anchor to
       centre it, so its x values come from a measured wordmark width of 104.6. -->
  <g transform="translate(522.5 98.8) scale(1.6)" fill="none" stroke="#343c54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22V8" />
    <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
    <circle cx="12" cy="5" r="3" />
  </g>
  <text x="571.5" y="131" font-family="Avenir Next, Helvetica, sans-serif" font-weight="600" font-size="36" fill="#343c54">Doska</text>

  <g text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-weight="800" font-size="88" letter-spacing="-2">
    <text x="600" y="292" fill="#343c54">Kanban for</text>
    <text x="600" y="390" fill="#725cff">your own projects</text>
  </g>

  <text x="600" y="458" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif" font-weight="600" font-size="30" fill="#676d7f">Local-first. Works offline. Self-host the sync.</text>

  <text x="600" y="524" text-anchor="middle" font-family="Geist Mono, Menlo, monospace" font-size="22" fill="#7b8199">Open source · self-hosted · Markdown cards</text>
</svg>
