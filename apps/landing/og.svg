<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#232939" />

  <!-- The header's mark, without favicon.svg's tile: on this ground the tile is
       invisible anyway, and dropping it lets the anchor set the lockup's left
       edge rather than sitting inset from it. -->
  <g transform="translate(76.8 78.8) scale(1.6)" fill="none" stroke="#f7f7f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22V8" />
    <path d="M5 12H2a10 10 0 0 0 20 0h-3" />
    <circle cx="12" cy="5" r="3" />
  </g>
  <text x="128" y="111" font-family="Avenir Next, Helvetica, sans-serif" font-weight="600" font-size="36" fill="#f7f7f8">Doska</text>

  <g font-family="Avenir Next, Helvetica, sans-serif" font-weight="800" font-size="88" letter-spacing="-2">
    <text x="80" y="272" fill="#f7f7f8">A Kanban board</text>
    <text x="80" y="370" fill="#9585ff">made of Markdown</text>
  </g>

  <text x="80" y="438" font-family="Avenir Next, Helvetica, sans-serif" font-weight="600" font-size="30" fill="#a2a7b5">Local-first. Works offline. Self-host the sync.</text>

  <text x="80" y="504" font-family="Geist Mono, Menlo, monospace" font-size="22" fill="#676d7f">Open source · self-hosted · MCP-ready</text>
</svg>
