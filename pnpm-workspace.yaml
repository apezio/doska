packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Reaches us only through @better-auth/cli, and we never touch Prisma.
  '@prisma/client': false
  # Pulled in only as drizzle-orm's optional peer; we use pg/PGlite, so it never
  # needs its native build.
  better-sqlite3: false
  esbuild: true
  msw: false

# All transitive; each pins the first release that clears a Dependabot advisory.
overrides:
  brace-expansion: ^5.0.8
  postcss: ^8.5.24
  find-my-way: ^9.7.0
  fast-uri: ^3.1.4
  shell-quote: ^1.10.0
  js-yaml: ^4.3.0
  hono: ^4.12.32
  '@hono/node-server': ^2.0.12
  # drizzle-kit still pulls the deprecated @esbuild-kit chain, pinned to 0.18.
  esbuild@<0.24.3: ^0.25.12

minimumReleaseAgeExclude:
  - '@base-ui/react@1.6.0'
  - '@base-ui/utils@0.3.1'
  - lucide-react@1.21.0
  - postcss@8.5.24
