packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAgeStrict: true

allowBuilds:
  esbuild: true

# Dependabot advisory
overrides:
  brace-expansion: ^5.0.8
  postcss: ^8.5.18
  find-my-way: ^9.7.0
  fast-uri: ^3.1.4
  shell-quote: ^1.10.0
  js-yaml: ^4.3.0
  hono: ^4.12.32
  '@hono/node-server': ^2.0.12
  # drizzle-kit still pulls the deprecated @esbuild-kit chain, pinned to 0.18.
  esbuild@<0.24.3: ^0.25.12
